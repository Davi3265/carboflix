spring.application.name=demo

# No Render a porta vem da variavel PORT; localmente continua 8080.
server.port=${PORT:8080}

# DB_URL completa tem prioridade (uso local). No Render a URL e montada a partir
# de DB_HOST, DB_PORT e DB_NAME, que o render.yaml preenche com os dados do banco.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carboflix}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Segredo usado para assinar/validar os tokens JWT (Aula 9). Troque o valor
# padrao definindo a variavel de ambiente JWT_SECRET antes de ir para producao.
jwt.secret=${JWT_SECRET:chave-secreta-carboflix-trocar-em-producao}
