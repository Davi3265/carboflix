spring.application.name=demo

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carboflix}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Segredo usado para assinar/validar os tokens JWT (Aula 9). Troque o valor
# padrao definindo a variavel de ambiente JWT_SECRET antes de ir para producao.
jwt.secret=${JWT_SECRET:chave-secreta-carboflix-trocar-em-producao}
